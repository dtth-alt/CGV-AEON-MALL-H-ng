  return(f=='dai'?`<p class="note">Thời lượng trung bình: ${avg.toFixed(1)} phút</p>`:'')+tbl(['Mã','Tên phim','Thể loại','Thời lượng','Khởi chiếu','Độ tuổi','Số suất'],a.map(p=>[p.id,E(p.ten),p.tl,p.dur+' phút',p.kc,p.dt,p.n]))}},
fb:{n:'Bắp nước (F&B)',src:'View vw_SanPhamFB_TonKho · Truy vấn 10 (tìm theo tên và khoảng giá)',
 ctl:()=>`<div class="ctl"><input id="q" placeholder="Tên sản phẩm (VD: Coca)" oninput="upd()"><input id="a" type="number" placeholder="Giá từ" oninput="upd()"><input id="b" type="number" placeholder="Giá đến" oninput="upd()"></div>`,
 run:()=>{const q=v('q').toLowerCase(),a=+v('a')||0,b=+v('b')||1e12;return tbl(['Mã','Sản phẩm','Giá bán','Tồn kho','Trạng thái'],SP.filter(s=>s.ten.toLowerCase().includes(q)&&s.gia>=a&&s.gia<=b).sort((x,y)=>y.gia-x.gia).map(s=>{const t=ton(s.id);return[s.id,E(s.ten),money(s.gia),t,t==0?'<span class="no">Hết hàng</span>':t<400?'<span class="wn">Sắp hết</span>':'<span class="ok">Còn hàng</span>']}))}},
hd:{n:'Hóa đơn',src:'View vw_DanhSachHoaDon (hóa đơn kèm khách hàng và nhân viên lập)',
 ctl:()=>`<div class="ctl"><input id="q" placeholder="Tìm mã HĐ / khách / nhân viên..." oninput="upd()"></div>`,
 run:()=>{const q=v('q').toLowerCase();return tbl(['Mã HĐ','Ngày lập','Mã KH','Khách hàng','SĐT','Nhân viên lập','Thanh toán','Trạng thái','Tổng tiền',''],HD.map(h=>{const k=KH.find(x=>x.id==h.kh);return[h.id,fmt(h.time),h.kh||'KH-Vãng lai',k?E(k.ten):'Khách vãng lai',k?k.sdt:'',E(NVm[h.nv].ten),h.pt,h.tt,money(h.tong),`<button class="btn" onclick="detail('${h.id}')">Chi tiết</button>`]}).filter(r=>r.slice(0,6).join(' ').toLowerCase().includes(q)).reverse())}},
kh:{n:'Khách hàng',src:'Truy vấn 4 (RIGHT JOIN KH–HĐ) · 7 (điểm > TB) · 8 (UNION) · 9A (INTERSECT) · 9B (EXCEPT)',
 ctl:()=>`<div class="ctl"><select id="kq" onchange="upd()">${opts([['4','TV4: Khách hàng và hóa đơn'],['7','TV7: Điểm tích lũy cao hơn trung bình'],['8','TV8: Khách hàng ∪ Nhân viên'],['9a','TV9A: Trùng cả KH và NV (INTERSECT)'],['9b','TV9B: Khách hàng không trùng nhân viên (EXCEPT)']])}</select></div>`,
 run:()=>{const q=v('kq'),pp=[...KH.map(k=>[k.ten,k.sdt]),...NV.map(n=>[n.ten,n.sdt])],ks=new Set(NV.map(n=>n.ten+n.sdt));
  if(q=='4')return tbl(['Mã KH','Họ tên','SĐT','Mã HĐ','Ngày lập','Tổng tiền','Trạng thái'],KH.flatMap(k=>{const a=HD.filter(h=>h.kh==k.id);return a.length?a.map(h=>[k.id,E(k.ten),k.sdt,h.id,fmt(h.time),money(h.tong),h.tt]):[[k.id,E(k.ten),k.sdt,'','','','']]}));
  if(q=='7'){const avg=KH.reduce((a,k)=>a+diem(k.id),0)/KH.length;return`<p class="note">Điểm trung bình: ${avg.toFixed(2)}</p>`+tbl(['Mã KH','Họ tên','SĐT','Điểm tích lũy'],KH.filter(k=>diem(k.id)>avg).sort((a,b)=>diem(b.id)-diem(a.id)).map(k=>[k.id,E(k.ten),k.sdt,diem(k.id)]))}
  if(q=='8')return tbl(['Họ tên','SĐT','Loại'],[...KH.map(k=>[E(k.ten),k.sdt,'Khách hàng']),...NV.map(n=>[E(n.ten),n.sdt,'Nhân viên'])].sort((a,b)=>a[0].localeCompare(b[0],'vi')));
  const both=KH.filter(k=>ks.has(k.ten+k.sdt));return q=='9a'?tbl(['Họ tên','SĐT'],both.map(k=>[E(k.ten),k.sdt])):tbl(['Họ tên','SĐT'],KH.filter(k=>!ks.has(k.ten+k.sdt)).map(k=>[E(k.ten),k.sdt]))}},
dt:{n:'Doanh thu',src:'View vw_ThongKeDoanhThuPhim (số vé bán và doanh thu theo phim)',ctl:()=>'',
 run:()=>{const a=PH.map(p=>{const ids=new Set(SC.filter(s=>s.ph==p.id).map(s=>s.id)),vs=VE.filter(x=>ids.has(x.sc));return[p.id,E(p.ten),p.tl,vs.length,vs.reduce((s,x)=>s+x.gia,0)]});
  return`<p class="note">Tổng: ${a.reduce((s,r)=>s+r[3],0)} vé · ${money(a.reduce((s,r)=>s+r[4],0))}</p>`+tbl(['Mã','Phim','Thể loại','Tổng vé bán','Doanh thu vé'],a.sort((x,y)=>y[4]-x[4]).map(r=>[r[0],r[1],r[2],r[3],money(r[4])]))}},
truc:{n:'Lịch trực',src:'View vw_LichTrucNhanVien (phân công ca trực nhân viên)',
 ctl:()=>`<div class="ctl"><select id="td" onchange="upd()">${opts([['','Tất cả ngày'],...NG.map(n=>[n,n])],'2026-11-01')}</select></div>`,
 run:()=>tbl(['Mã PC','Nhân viên','Chức vụ','Ngày','Ca','Phòng trực'],PCT.filter(p=>!v('td')||p.ngay==v('td')).map(p=>{const n=NVm[p.nv];return[p.id,E(n.ten),n.cv,p.ngay,p.ca,p.room?PCm[p.room].ten:'Toàn khu vực rạp']}))}};
let cur='lich';
function show(k){cur=k;document.getElementById('nav').innerHTML=Object.keys(T).map(x=>`<button class="${x==k?'on':''}" onclick="show('${x}')">${T[x].n}</button>`).join('');
 document.getElementById('main').innerHTML=`<p class="src">${T[k].src}</p>${T[k].ctl()}<div id="res"></div>`;upd()}
const upd=()=>document.getElementById('res').innerHTML=T[cur].run();
const toast=s=>{const t=document.getElementById('t');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3000)};
const openM=h=>{document.getElementById('mc').innerHTML=h;document.getElementById('m').style.display='flex'},closeM=()=>document.getElementById('m').style.display='none';
function detail(id){const h=HD.find(x=>x.id==id);openM(`<h3>Hóa đơn ${id}</h3>${tbl(['Vé','Phim','Suất','Ghế','Giá'],VE.filter(x=>x.hd==id).map(x=>{const s=SCm[x.sc];return[x.id,E(PHm[s.ph].ten),s.ngay+' '+s.bd,x.ghe,money(x.gia)]}))}<br>${tbl(['Sản phẩm','SL','Thành tiền'],CT.filter(c=>c.hd==id).map(c=>[E(SPm[c.sp].ten),c.sl,money(c.tt)]))}<p class="tot">Tổng: ${money(h.tong)}</p><button class="btn" onclick="closeM()">Đóng</button>`)}
/* ===== Đặt vé ===== */
let B;
function book(id){const s=SCm[id],p=PHm[s.ph],r=PCm[s.room];B={s,r,sel:new Set(),fb:{}};
 openM(`<h3>${E(p.ten)} <small>(${p.dt})</small></h3><p class="note">${r.ten} · ${r.loai} · ${s.ngay} · ${s.bd}–${s.kt}</p><div class="screen">MÀN HÌNH</div><div id="sm"></div>
 <p class="note">Ghế VIP/Sweetbox/Recliner có viền màu; ghế gạch ngang đã bán. Giá hiển thị khi di chuột.</p>
 <div class="ctl"><select id="fs">${opts(SP.map(x=>[x.id,x.ten+' – '+money(x.gia)]))}</select><input id="fq" type="number" min="1" value="1" style="width:70px"><button class="btn" onclick="addFb()">+ Bắp nước</button></div><div id="fbl"></div>
 <div class="ctl"><input id="sdt" placeholder="SĐT khách (tuỳ chọn)" oninput="lk()"><input id="ten" maxlength="50" placeholder="Họ tên (nếu SĐT mới)"></div><p class="note" id="kn"></p>
 <div class="ctl"><select id="nv">${opts(NV.filter(n=>n.cv=='Nhân viên bán vé').map(n=>[n.id,'NV: '+n.ten]))}</select><select id="pt">${opts(PT.map(x=>[x,x]))}</select></div>
 <div class="tot" id="tot"></div><button class="btn p" onclick="confirmB()">Thanh toán</button> <button class="btn" onclick="closeM()">Hủy</button>`);drawSeats();calc()}
function drawSeats(){const sd=new Set(sold(B.s.id).map(x=>x.ghe));let h='';
 for(const hg of 'ABCDEFGH'.slice(0,B.r.h)){h+=`<div class="row"><b>${hg}</b>`;for(let n=1;n<=B.r.c;n++){const g=B.r.id+'-'+hg+pad(n,2),t=gType(B.r.id,hg),x=sd.has(g);h+=`<button class="sb ${t=='4DX Motion'?'4DX':t} ${x?'s':''} ${B.sel.has(g)?'on':''}" ${x?'disabled':''} title="${t} · ${money(price(B.r.id,t,B.s.bd))}" onclick="tg('${g}')">${n}</button>`}h+='</div>'}
 document.getElementById('sm').innerHTML=h}
function tg(g){B.sel.has(g)?B.sel.delete(g):B.sel.add(g);drawSeats();calc()}
const seatP=g=>price(B.r.id,gType(B.r.id,g.split('-')[1][0]),B.s.bd);
function addFb(){const sp=v('fs'),q=Math.max(1,+v('fq')||1);B.fb[sp]=(B.fb[sp]||0)+q;calc()}
function rmFb(sp){delete B.fb[sp];calc()}
function calc(){const fe=Object.entries(B.fb);document.getElementById('fbl').innerHTML=fe.map(([s,q])=>`<div class="note">${E(SPm[s].ten)} × ${q} = ${money(q*SPm[s].gia)} <a href="#" onclick="rmFb('${s}');return false">xóa</a></div>`).join('');
 const tv=[...B.sel].reduce((a,g)=>a+seatP(g),0),tf=fe.reduce((a,[s,q])=>a+q*SPm[s].gia,0);
 document.getElementById('tot').textContent=`${B.sel.size} vé: ${money(tv)} · Bắp nước: ${money(tf)} · Tổng: ${money(tv+tf)}`}
function lk(){const k=KH.find(x=>x.sdt==v('sdt').trim());document.getElementById('kn').textContent=k?`Khách hàng: ${k.ten} (${diem(k.id)} điểm)`:''}
function confirmB(){const g=[...B.sel];if(!g.length)return alert('Vui lòng chọn ít nhất 1 ghế.');
 const sdt=v('sdt').trim();let kh=null;
 if(sdt){if(!/^0\d{9,10}$/.test(sdt))return alert('Số điện thoại không hợp lệ.');let k=KH.find(x=>x.sdt==sdt);
  if(!k){const t=v('ten').trim();if(!t)return alert('SĐT mới: vui lòng nhập họ tên để tạo khách hàng.');k={id:'KH'+pad(KH.length+1,3),ten:t,sdt};KH.push(k)}kh=k.id}
 for(const s in B.fb)if(B.fb[s]>ton(s))return alert('Không đủ tồn kho: '+SPm[s].ten);
 const id=addOrder({sc:B.s.id,seats:g,kh,nv:v('nv'),pt:v('pt'),time:Date.now(),fb:Object.entries(B.fb)});
 closeM();toast(`Đã tạo hóa đơn ${id} – ${money(HD[HD.length-1].tong)}`);upd()}
show('lich');
</script></body></html>
